name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Must match docker-compose.yml: migrations need the pgvector extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sunleon
          POSTGRES_PASSWORD: sunleon_dev_password
          POSTGRES_DB: sunleon_voice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunleon -d sunleon_voice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sunleon:sunleon_dev_password@localhost:5432/sunleon_voice
      AUTH_SECRET: ci-only-placeholder-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
      # Deliberately no PAYSTACK_SECRET_KEY / AI_GATEWAY_API_KEY: CI proves the BLOCKED paths,
      # and tests that need a key set a fake one at the provider boundary themselves.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build
