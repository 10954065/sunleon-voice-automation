services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sunleon
      POSTGRES_PASSWORD: sunleon_dev_password
      POSTGRES_DB: sunleon_voice
    ports:
      - "5432:5432"
    volumes:
      - sunleon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunleon -d sunleon_voice"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sunleon_postgres_data:
